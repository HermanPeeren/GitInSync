COM_GITINSYNC="GitInSync"
COM_GITINSYNC_CONFIGURATION="GitInSync Options"
COM_GITINSYNC_XML_DESCRIPTION="Keeps the content of the site (articles, categories, custom fields, tags and menus) in a git repository, locally or on GitHub: history, restore, revert, branches and merges, all from Joomla."

COM_GITINSYNC_ACTION_APPLY="Apply versions"
COM_GITINSYNC_ACTION_APPLY_DESC="Allows users in the group to restore, revert, cherry-pick, merge, pull and switch branches: actions that change the site's content."

; Options
COM_GITINSYNC_CONFIG_REPOSITORY="Repository"
COM_GITINSYNC_CONFIG_MODE_LABEL="Where"
COM_GITINSYNC_CONFIG_MODE_DESC="A git repository on this server, the same pushed to GitHub, or GitHub only through its API. None of them needs git on the server."
COM_GITINSYNC_CONFIG_REPOSITORY_PATH_LABEL="Repository folder"
COM_GITINSYNC_CONFIG_REPOSITORY_PATH_DESC="The folder of the local repository. Relative paths start at the site's root. Empty: a folder gitinsync-repository next to the site's root, outside the web root where possible."
COM_GITINSYNC_CONFIG_DEFAULT_BRANCH_LABEL="Default branch"
COM_GITINSYNC_CONFIG_DEFAULT_BRANCH_DESC="The branch the site follows until you switch to another one."
COM_GITINSYNC_CONFIG_GITHUB_OWNER_LABEL="GitHub owner"
COM_GITINSYNC_CONFIG_GITHUB_OWNER_DESC="The user or organisation the repository belongs to."
COM_GITINSYNC_CONFIG_GITHUB_REPOSITORY_LABEL="GitHub repository"
COM_GITINSYNC_CONFIG_GITHUB_REPOSITORY_DESC="The name of the repository on GitHub. An empty repository gets a first commit with a README."
COM_GITINSYNC_CONFIG_GITHUB_TOKEN_LABEL="GitHub token"
COM_GITINSYNC_CONFIG_GITHUB_TOKEN_DESC="A fine-grained personal access token for this repository only, with \"Contents: read and write\" and \"Metadata: read\". The token is never shown again: leave the field empty to keep it, type - to remove it."
COM_GITINSYNC_CONFIG_GITHUB_TOKEN_IS_SET="A token is set; leave empty to keep it"
COM_GITINSYNC_CONFIG_GITHUB_TOKEN_NOT_SET="No token set"
COM_GITINSYNC_CONFIG_CONTENT="Content"
COM_GITINSYNC_CONFIG_CONTENT_TYPES_LABEL="Content to keep"
COM_GITINSYNC_CONFIG_CONTENT_TYPES_DESC="What goes into the repository. Articles refer to their category, custom fields and tags; keep those too, or restoring an article on another site may fail."
COM_GITINSYNC_CONFIG_NON_PUBLIC_LABEL="Unpublished and non-public content"
COM_GITINSYNC_CONFIG_NON_PUBLIC_DESC="Whether content that isn't published, or that has an access level other than Public, goes into the repository."
COM_GITINSYNC_CONFIG_NON_PUBLIC_PRIVATE_ONLY="Only when the repository is private (a local repository counts as private)"
COM_GITINSYNC_CONFIG_NON_PUBLIC_ALWAYS="Always"
COM_GITINSYNC_CONFIG_NON_PUBLIC_NEVER="Never"
COM_GITINSYNC_CONFIG_INCLUDE_TRASHED_LABEL="Keep trashed items"
COM_GITINSYNC_CONFIG_INCLUDE_TRASHED_DESC="No: trashing an item removes it from the branch (its history stays)."
COM_GITINSYNC_CONFIG_EXCLUDE_NOTE_LABEL="Excluding an item"
COM_GITINSYNC_CONFIG_EXCLUDE_NOTE_DESC="Each item's edit form has a GitInSync tab where you can exclude it. Excluding removes the item from the branch from then on; earlier commits still contain it, also on GitHub once they have been pushed."
COM_GITINSYNC_CONFIG_COMMITS="Commits"
COM_GITINSYNC_CONFIG_COMMIT_ON_SAVE_LABEL="Commit directly after saving"
COM_GITINSYNC_CONFIG_COMMIT_ON_SAVE_DESC="Yes: a save is committed right after the page has been sent. No: the scheduled task commits it. On GitHub every commit takes several requests, so the scheduled task is the lighter choice."
COM_GITINSYNC_CONFIG_AUTHOR_IDENTITY_LABEL="Commit author"
COM_GITINSYNC_CONFIG_AUTHOR_IDENTITY_DESC="The name and email in a commit. With a public repository, a no-reply address keeps the users' email addresses out of it."
COM_GITINSYNC_CONFIG_AUTHOR_NOREPLY="User's name, no-reply email"
COM_GITINSYNC_CONFIG_AUTHOR_REAL="User's name and email"
COM_GITINSYNC_CONFIG_AUTHOR_FIXED="One fixed name and email"
COM_GITINSYNC_CONFIG_FIXED_NAME_LABEL="Name"
COM_GITINSYNC_CONFIG_FIXED_EMAIL_LABEL="Email"
COM_GITINSYNC_CONFIG_TIME_BUDGET_LABEL="Seconds per step"
COM_GITINSYNC_CONFIG_TIME_BUDGET_DESC="How long one step of work in the browser may take, between 3 and 120 seconds. Keep it well below the server's maximum execution time."

