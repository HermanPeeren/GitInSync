COM_GITINSYNC="GitInSync"
COM_GITINSYNC_CONFIGURATION="GitInSync-opties"
COM_GITINSYNC_XML_DESCRIPTION="Bewaart de inhoud van de site (artikelen, categorieën, extra velden, tags en menu's) in een git-repository, lokaal of op GitHub: geschiedenis, terugzetten, terugdraaien, branches en merges, allemaal vanuit Joomla."

COM_GITINSYNC_ACTION_APPLY="Versies toepassen"
COM_GITINSYNC_ACTION_APPLY_DESC="Gebruikers in de groep mogen terugzetten, terugdraaien, cherry-picken, mergen, pullen en van branch wisselen: acties die de inhoud van de site veranderen."

; Opties
COM_GITINSYNC_CONFIG_REPOSITORY="Repository"
COM_GITINSYNC_CONFIG_MODE_LABEL="Waar"
COM_GITINSYNC_CONFIG_MODE_DESC="Een git-repository op deze server, dezelfde gepusht naar GitHub, of alleen GitHub via de API. Geen van alle heeft git op de server nodig."
COM_GITINSYNC_CONFIG_REPOSITORY_PATH_LABEL="Map van de repository"
COM_GITINSYNC_CONFIG_REPOSITORY_PATH_DESC="De map van de lokale repository. Relatieve paden beginnen bij de root van de site. Leeg: een map gitinsync-repository naast de root van de site, waar mogelijk buiten de webroot."
COM_GITINSYNC_CONFIG_DEFAULT_BRANCH_LABEL="Standaardbranch"
COM_GITINSYNC_CONFIG_DEFAULT_BRANCH_DESC="De branch die de site volgt, tot je naar een andere wisselt."
