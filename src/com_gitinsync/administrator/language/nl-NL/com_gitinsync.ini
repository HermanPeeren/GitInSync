COM_GITINSYNC_CONFIG_CONTENT_TYPES_LABEL="Te bewaren inhoud"
COM_GITINSYNC_CONFIG_CONTENT_TYPES_DESC="Wat er in de repository komt. Artikelen verwijzen naar hun categorie, extra velden en tags; bewaar die ook, anders kan het terugzetten van een artikel op een andere site mislukken."
COM_GITINSYNC_CONFIG_NON_PUBLIC_LABEL="Ongepubliceerde en niet-openbare inhoud"
COM_GITINSYNC_CONFIG_NON_PUBLIC_DESC="Of inhoud die niet gepubliceerd is, of een ander toegangsniveau dan Openbaar heeft, in de repository komt."
