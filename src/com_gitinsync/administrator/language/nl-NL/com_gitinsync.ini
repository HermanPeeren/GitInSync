COM_GITINSYNC_CONFIG_GITHUB_REPOSITORY_DESC="De naam van de repository op GitHub. Een lege repository krijgt een eerste commit met een README."
COM_GITINSYNC_CONFIG_GITHUB_TOKEN_LABEL="GitHub-token"
COM_GITINSYNC_CONFIG_GITHUB_TOKEN_DESC="Een fine-grained personal access token voor alleen deze repository, met \"Contents: read and write\" en \"Metadata: read\". De token wordt nooit meer getoond: laat het veld leeg om hem te houden, typ - om hem te verwijderen."
COM_GITINSYNC_CONFIG_GITHUB_TOKEN_IS_SET="Er is een token ingesteld; laat leeg om hem te houden"
COM_GITINSYNC_CONFIG_GITHUB_TOKEN_NOT_SET="Geen token ingesteld"
