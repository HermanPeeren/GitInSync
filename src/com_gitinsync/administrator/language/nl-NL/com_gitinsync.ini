COM_GITINSYNC_CONFIG_INCLUDE_TRASHED_DESC="Nee: een item naar de prullenbak verplaatsen haalt het uit de branch (de geschiedenis blijft)."
COM_GITINSYNC_CONFIG_EXCLUDE_NOTE_LABEL="Een item uitsluiten"
COM_GITINSYNC_CONFIG_EXCLUDE_NOTE_DESC="Het bewerkformulier van elk item heeft een tab GitInSync waar je het kunt uitsluiten. Uitsluiten haalt het item vanaf dat moment uit de branch; eerdere commits bevatten het nog, ook op GitHub als ze gepusht zijn."
COM_GITINSYNC_CONFIG_COMMITS="Commits"
