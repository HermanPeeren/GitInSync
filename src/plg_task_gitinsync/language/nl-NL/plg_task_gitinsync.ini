PLG_TASK_GITINSYNC="Taak - GitInSync"
PLG_TASK_GITINSYNC_XML_DESCRIPTION="Geplande taken voor GitInSync: de wijzigingen in de inhoud committen en naar GitHub pushen, en pullen wat op GitHub is gecommit."
PLG_TASK_GITINSYNC_COMMIT_TITLE="GitInSync: wijzigingen committen"
PLG_TASK_GITINSYNC_COMMIT_DESC="Commit de opgeslagen wijzigingen in de branch van de site en pusht ze in de modus \"Lokale repository, gepusht naar GitHub\". Scant desgewenst eerst alle inhoud, voor wijzigingen die niet via een bewerkformulier zijn opgeslagen."
PLG_TASK_GITINSYNC_PULL_TITLE="GitInSync: pullen van GitHub"
PLG_TASK_GITINSYNC_PULL_DESC="Haalt binnen wat op GitHub in de branch van de site is gecommit (bijvoorbeeld een gemergde pull request) en past het toe op de site. Conflicten stoppen de taak; los ze op in GitInSync."
PLG_TASK_GITINSYNC_FIELD_TIME_BUDGET_LABEL="Seconden per run"
PLG_TASK_GITINSYNC_FIELD_TIME_BUDGET_DESC="Hoe lang één run mag werken, tussen 3 en 120 seconden. Is er werk over, dan draait de taak bij de volgende tik opnieuw en gaat verder waar hij stopte."
PLG_TASK_GITINSYNC_FIELD_SCAN_LABEL="Eerst alle inhoud scannen"
PLG_TASK_GITINSYNC_FIELD_SCAN_DESC="Vergelijkt elk item met de branch, om wijzigingen te vinden die geen event gaven: batchacties, imports, directe databasewijzigingen. Duurt langer op een grote site; eens per dag is meestal genoeg."
PLG_TASK_GITINSYNC_FIELD_PUSH_LABEL="Naar GitHub pushen"
PLG_TASK_GITINSYNC_FIELD_PUSH_DESC="In de modus \"Lokale repository, gepusht naar GitHub\": de branch na het committen pushen."
PLG_TASK_GITINSYNC_FIELD_USER_LABEL="Toepassen als"
PLG_TASK_GITINSYNC_FIELD_USER_DESC="De gebruiker als wie de wijzigingen worden toegepast: diens rechten tellen, en die heeft het GitInSync-recht \"Versies toepassen\" nodig."
PLG_TASK_GITINSYNC_LOG_ALL_DONE="GitInSync: alles klaar."
PLG_TASK_GITINSYNC_LOG_FAILED="GitInSync stopte met een fout: %s"
PLG_TASK_GITINSYNC_LOG_NO_USER="GitInSync: kies in de opties van de taak een gebruiker die versies mag toepassen."
PLG_TASK_GITINSYNC_LOG_NOT_INSTALLED="GitInSync: de component is niet geïnstalleerd of niet ingeschakeld."
PLG_TASK_GITINSYNC_LOG_CONFLICTS="GitInSync: bewerking %d heeft conflicten; los ze op in GitInSync."
PLG_TASK_GITINSYNC_LOG_APPLIED="GitInSync: %1$d items toegepast, nog %2$d te gaan."
