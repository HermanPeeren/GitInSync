PLG_TASK_GITINSYNC="Task - GitInSync"
PLG_TASK_GITINSYNC_XML_DESCRIPTION="Scheduled tasks for GitInSync: commit the changes to the content and push them to GitHub, and pull what was committed on GitHub."
PLG_TASK_GITINSYNC_COMMIT_TITLE="GitInSync: commit changes"
PLG_TASK_GITINSYNC_COMMIT_DESC="Commits the saved changes to the site's branch and, in the mode \"Local repository, pushed to GitHub\", pushes them. Optionally scans all content first, for changes that weren't saved through an edit form."
PLG_TASK_GITINSYNC_PULL_TITLE="GitInSync: pull from GitHub"
PLG_TASK_GITINSYNC_PULL_DESC="Brings in what was committed to the site's branch on GitHub (a merged pull request, for instance) and applies it to the site. Conflicts stop the task; resolve them in GitInSync."
PLG_TASK_GITINSYNC_FIELD_TIME_BUDGET_LABEL="Seconds per run"
PLG_TASK_GITINSYNC_FIELD_TIME_BUDGET_DESC="How long one run may work, between 3 and 120 seconds. With work left, the task runs again on the next tick and goes on where it stopped."
PLG_TASK_GITINSYNC_FIELD_SCAN_LABEL="Scan all content first"
PLG_TASK_GITINSYNC_FIELD_SCAN_DESC="Compares every item with the branch, to find changes that fired no event: batch actions, imports, direct database changes. Takes longer on a large site; once a day is usually enough."
PLG_TASK_GITINSYNC_FIELD_PUSH_LABEL="Push to GitHub"
PLG_TASK_GITINSYNC_FIELD_PUSH_DESC="In the mode \"Local repository, pushed to GitHub\": push the branch after committing."
PLG_TASK_GITINSYNC_FIELD_USER_LABEL="Apply as"
PLG_TASK_GITINSYNC_FIELD_USER_DESC="The user the changes are applied as: their permissions count, and they need the GitInSync permission \"Apply versions\"."
PLG_TASK_GITINSYNC_LOG_ALL_DONE="GitInSync: all done."
PLG_TASK_GITINSYNC_LOG_FAILED="GitInSync stopped with an error: %s"
PLG_TASK_GITINSYNC_LOG_NO_USER="GitInSync: choose a user who may apply versions in the task's options."
PLG_TASK_GITINSYNC_LOG_NOT_INSTALLED="GitInSync: the component is not installed or not enabled."
PLG_TASK_GITINSYNC_LOG_CONFLICTS="GitInSync: operation %d has conflicts; resolve them in GitInSync."
PLG_TASK_GITINSYNC_LOG_APPLIED="GitInSync: %1$d items applied, %2$d to go."
