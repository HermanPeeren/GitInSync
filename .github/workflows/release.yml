name: Release

# Pushing a tag v<version> is the whole release procedure: the checks run, the
# package is built and attached to a GitHub release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip, curl
          coverage: none

      - name: The tag must match the manifest
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST=$(php -r 'echo trim((string) simplexml_load_file("src/pkg_gitinsync.xml")->version);')
          echo "tag: $TAG   manifest: $MANIFEST"
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the manifest version $MANIFEST. Bump src/pkg_gitinsync.xml, or tag the version it already carries."
            exit 1
          fi

      # A new version needs a schema file of its own, or Joomla records the
      # wrong schema version on update.
      - name: The manifest version must have a schema file
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for db in mysql postgresql; do
            if [ ! -f "src/com_gitinsync/administrator/sql/updates/${db}/${VERSION}.sql" ]; then
              echo "::error::No sql/updates/${db}/${VERSION}.sql. Add one, even if it only holds a comment."
              exit 1
            fi
          done

      # The security review is a release step: docs/security-review.md records the
      # version it was last done for, and that must be the version being released.
      - name: The security review must be done for this version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! grep -q "^Last full review: ${VERSION}," docs/security-review.md; then
            echo "::error::docs/security-review.md was not reviewed for ${VERSION}. Go through its release checklist and update the 'Last full review' line."
            exit 1
          fi

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Fetch Joomla
        run: |
          url="https://github.com/joomla/joomla-cms/releases/download/${JOOMLA_VERSION}/Joomla_${JOOMLA_VERSION}-Stable-Full_Package.tar.gz"
          curl -sSL -o joomla.tar.gz "$url"
          mkdir -p joomla
          tar -xzf joomla.tar.gz -C joomla
        env:
          JOOMLA_VERSION: 6.2.0

      - name: Unit tests
        run: composer test

      - name: Static analysis
        run: composer analyse

      - name: Coding standards
        run: composer cs

      - name: Known vulnerabilities in dependencies
        run: composer audit

      - name: Build the package
        run: php build/build.php

      # The package is what people install, so its contents are asserted once
      # rather than the build script being trusted forever.
      - name: The package must be installable
        run: |
          php -r '
            $zip = new ZipArchive();
            $zip->open(glob("build/pkg_gitinsync-*.zip")[0]);

            $names = [];
            for ($i = 0; $i < $zip->numFiles; $i++) {
                $names[] = $zip->getNameIndex($i);
            }

            $bad = array_filter($names, static fn (string $n): bool => str_contains($n, "\\"));
            if ($bad !== []) {
                fwrite(STDERR, "Windows separators in the package:\n  " . implode("\n  ", $bad) . "\n");
                exit(1);
            }

            foreach ([
                "pkg_gitinsync.xml",
                "script.php",
                "com_gitinsync/gitinsync.xml",
                "com_gitinsync/administrator/services/provider.php",
                "com_gitinsync/administrator/src/Extension/GitInSyncComponent.php",
                "com_gitinsync/administrator/sql/install.mysql.utf8.sql",
                "com_gitinsync/administrator/sql/install.postgresql.utf8.sql",
                "com_gitinsync/administrator/language/en-GB/com_gitinsync.ini",
                "com_gitinsync/media/js/run.js",
                "plg_content_gitinsync/gitinsync.xml",
                "plg_content_gitinsync/services/provider.php",
                "plg_task_gitinsync/gitinsync.xml",
                "plg_task_gitinsync/services/provider.php",
                "plg_task_gitinsync/forms/commit.xml",
            ] as $required) {
                if (!in_array($required, $names, true)) {
                    fwrite(STDERR, "Package has no {$required}.\n");
                    exit(1);
                }
            }

            echo "package holds " . count($names) . " files\n";
          '

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            build/pkg_gitinsync-*.zip \
            --title "GitInSync $GITHUB_REF_NAME" \
            --generate-notes
